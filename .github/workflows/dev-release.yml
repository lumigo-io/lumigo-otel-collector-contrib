name: dev-release
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'

env:
  TEST_RESULTS: testbed/tests/results/junit/results.xml
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

jobs:
  check-commit-message:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name != 'main'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit message
        id: check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -q "\[create-dev-release\]"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  build-dev-release:
    runs-on: ubuntu-latest
    needs: check-commit-message
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref_name != 'main') ||
      (github.event_name == 'push' && github.ref_name != 'main' && needs.check-commit-message.outputs.should_run == 'true')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.8"
          cache: false
      - name: Cache Go
        id: go-cache
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/go/pkg/mod
          key: go-cache-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      - name: Install dependencies
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: |
          make -j2 gomoddownload
      - name: Install Tools
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: make install-tools
      - name: Generate components
        run: make genotelcontribcol
      - name: Build Collector Binaries
        run: |
          make GOOS=linux GOARCH=amd64 otelcontribcol
          make GOOS=linux GOARCH=arm64 otelcontribcol
          make GOOS=darwin GOARCH=amd64 otelcontribcol
          make GOOS=darwin GOARCH=arm64 otelcontribcol
      - name: Verify Binaries Exist
        run: |
          files=(
            bin/otelcontribcol_darwin_arm64
            bin/otelcontribcol_darwin_amd64
            bin/otelcontribcol_linux_arm64
            bin/otelcontribcol_linux_amd64
          )
          for f in "${files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "ERROR: $f does not exist"
              exit 1
            fi
            echo "✓ $f"
          done
      - name: Upload Collector Binaries
        uses: actions/upload-artifact@v4
        with:
          name: dev-release-binaries
          path: ./bin/otelcontribcol_*
          retention-days: 30

  create-dev-release:
    runs-on: ubuntu-latest
    needs: build-dev-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Collector Binaries
        uses: actions/download-artifact@v4
        with:
          name: dev-release-binaries
          path: ./bin/
      - name: Determine Release Tag
        id: release_tag
        run: |
          # Get version using the same method as Makefile: git describe --always --match "v[0-9]*" HEAD
          BASE_VERSION=$(git describe --always --match "v[0-9]*" HEAD)
          
          # If git describe doesn't find a matching tag, fall back to versions.yaml
          if [[ ! "$BASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            if [ -f "versions.yaml" ]; then
              BASE_VERSION=$(grep -A 1 "module-sets:" versions.yaml | grep "version:" | head -1 | sed 's/.*version: *//' | tr -d ' ')
            else
              echo "ERROR: Could not determine base version"
              exit 1
            fi
          fi
          
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          BRANCH_NAME="${{ github.ref_name }}"
          BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]' | cut -c1-20)
          RELEASE_TAG="${BASE_VERSION}-dev-${BRANCH_NAME}-${SHORT_SHA}"
          
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.release_tag.outputs.tag }}" \
            --title "${{ steps.release_tag.outputs.tag }}" \
            --notes "Development release for testing.
          
          **Build Info:**
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Workflow: ${{ github.workflow }}
          - Run: ${{ github.run_number }}
          " \
            --prerelease \
            ./bin/otelcontribcol_*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Output Release URL
        run: |
          echo "::notice::Dev release created: ${{ steps.release_tag.outputs.tag }}"
          echo "::notice::Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.release_tag.outputs.tag }}"
